# StormTrace AI -  End-to-End Pipeline Configuration

experiment_name: "amphan_historical_proof"
domain:
  lat_min: 6.0
  lat_max: 38.0
  lon_min: 68.0
  lon_max: 98.0
  spatial_resolution_km: 12.0

data:
  nwp_source: "NCMRWF_NEPS_50MEMBER"
  climatology_source: "ERA5_30YEAR_REANALYSIS"
  ensemble_members: 50
  variables: ["precipitation", "temperature", "u10", "v10", "mslp", "humidity"]

models:
  st_gnn:
    checkpoint_path: "backend/models/st_gnn_checkpoint.pt"
    num_nodes: 42
    in_channels: 6
    hidden_dim: 64
    heads: 4
    forecast_horizon_hours: 240
  
  ddpm:
    checkpoint_path: "backend/models/ddpm_checkpoint.pt"
    in_channels: 1
    out_channels: 1
    base_dim: 32
    guidance_scale: 3.5
    input_resolution_km: 12.0
    output_resolution_km: 5.0

physics:
  mass_conservation: true
  moisture_flux_convergence: true
  hydrostatic_balance: true
  vorticity_preservation: true
  spectral_fourier_loss: true

event_detection:
  efi_threshold: -0.5
  min_area_km2: 100.0

output:
  export_json: "backend/data/pipeline_output.json"
