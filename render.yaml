services:
  - type: web
    name: stormtrace-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OWM_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false

