services:
  - type: web
    name: stormtrace-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn backend.api.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: OWM_KEY
        value: "" # Add in dashboard
      - key: MAPBOX_TOKEN
        value: "" # Add in dashboard
      - key: PORT
        value: "10000"
